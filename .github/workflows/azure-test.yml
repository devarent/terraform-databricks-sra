# Modified in the devarent fork, 2026-11-22: shared-change triggers and read-only CI defaults.
# This workflow is used for testing the Azure terraform module.

name: Azure Tests
on:
  push:
    paths:
      - 'azure/tf/**'
      - '.github/workflows/azure-test.yml'
      - '.github/workflows/terraform-ruw.yml'
      - 'common/tests/**'
  pull_request:
    paths:
      - 'azure/tf/**'
      - '.github/workflows/azure-test.yml'
      - '.github/workflows/terraform-ruw.yml'
      - 'common/tests/**'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-azure:
    uses: ./.github/workflows/terraform-ruw.yml
    with:
      working_directory: azure/tf
      terraform_fmt_check: true
      terraform_validate_enabled: true
      terraform_test_args: "-filter=tests/mock_plan.tftest.hcl"
